name: PR Governance Review

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  require-security-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate security review signal
        uses: actions/github-script@v7
        env:
          ALLOWED_SECURITY_REVIEW_ACTORS: ${{ vars.ALLOWED_SECURITY_REVIEW_ACTORS }}
          ALLOWED_MAIN_PUSH_ACTORS: ${{ vars.ALLOWED_MAIN_PUSH_ACTORS }}
        with:
          script: |
            const allowedReviewActors = (process.env.ALLOWED_SECURITY_REVIEW_ACTORS || "")
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);
            const allowedMergers = (process.env.ALLOWED_MAIN_PUSH_ACTORS || "")
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);

            if (allowedReviewActors.length === 0) {
              core.setFailed("ALLOWED_SECURITY_REVIEW_ACTORS is not configured");
              return;
            }

            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const approvedReview = reviews.find((review) => {
              const actor = review.user?.login || "";
              return allowedReviewActors.includes(actor) && review.state === "APPROVED";
            });

            const approvalComment = comments.find((comment) => {
              const actor = comment.user?.login || "";
              const body = comment.body || "";
              return allowedReviewActors.includes(actor) && /SECURITY_REVIEW:\s*APPROVED/i.test(body);
            });

            const body = pr.body || "";
            const mergerRulePresent = /OpenClaw \/ mini agent actor is not being used as a merger to `main`/i.test(body);

            if (!mergerRulePresent) {
              core.setFailed("PR template governance checklist is missing or incomplete");
              return;
            }

            if (!approvedReview && !approvalComment) {
              core.setFailed(
                "Missing security-agent approval. Require APPROVED review or comment `SECURITY_REVIEW: APPROVED` from an actor in ALLOWED_SECURITY_REVIEW_ACTORS."
              );
              return;
            }

            core.info(`Security review satisfied. Allowed mergers remain: ${allowedMergers.join(",") || "(unset)"}`);
