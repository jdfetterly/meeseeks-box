name: PR Governance Review

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  checks: write
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-governance-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sync-governance-check:
    if: |
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    steps:
      - name: Validate security review signal
        uses: actions/github-script@v7
        env:
          ALLOWED_SECURITY_REVIEW_ACTORS: ${{ vars.ALLOWED_SECURITY_REVIEW_ACTORS }}
          ALLOWED_MAIN_PUSH_ACTORS: ${{ vars.ALLOWED_MAIN_PUSH_ACTORS }}
        with:
          script: |
            const allowedReviewActors = (process.env.ALLOWED_SECURITY_REVIEW_ACTORS || "")
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);
            const allowedMergers = (process.env.ALLOWED_MAIN_PUSH_ACTORS || "")
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);
            const requiredCheckName = "PR Governance Review / require-security-review";
            const detailsUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summaryLines = [];
            let conclusion = "success";
            let title = "Governance review passed";

            const publishCheck = async (headSha, output) => {
              const existingChecks = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                check_name: requiredCheckName,
                per_page: 100,
              });

              const checkRun = existingChecks.data.check_runs
                .filter((run) => run.app?.slug === "github-actions")
                .sort((a, b) => new Date(b.started_at || b.created_at || 0) - new Date(a.started_at || a.created_at || 0))[0];

              const payload = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: requiredCheckName,
                status: "completed",
                conclusion,
                details_url: detailsUrl,
                output,
              };

              if (checkRun) {
                await github.rest.checks.update({
                  ...payload,
                  check_run_id: checkRun.id,
                });
                core.info(`Updated governance check run ${checkRun.id} on ${headSha} with conclusion '${conclusion}'.`);
                return;
              }

              await github.rest.checks.create({
                ...payload,
                head_sha: headSha,
              });
              core.info(`Created governance check run on ${headSha} with conclusion '${conclusion}'.`);
            };

            const failGovernance = (message) => {
              conclusion = "failure";
              title = "Governance review failed";
              summaryLines.push(message);
            };

            if (allowedReviewActors.length === 0) {
              failGovernance("ALLOWED_SECURITY_REVIEW_ACTORS is not configured");
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let pr;
            let prNumber;

            if (context.eventName === "pull_request_target") {
              pr = context.payload.pull_request;
              prNumber = pr.number;
            } else {
              prNumber = context.payload.issue.number;
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              pr = response.data;
            }

            if (pr.draft) {
              core.info("Draft PR; skipping governance gate.");
              return;
            }

            summaryLines.push(`PR #${prNumber}`);
            summaryLines.push(`Current head SHA: ${pr.head.sha}`);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const approvalComment = comments.find((comment) => {
              const actor = comment.user?.login || "";
              const body = comment.body || "";
              return (
                allowedReviewActors.includes(actor) &&
                /SECURITY_REVIEW:\s*APPROVED/i.test(body) &&
                new RegExp(`PR_HEAD_SHA:\\s*${pr.head.sha}`, "i").test(body)
              );
            });

            const body = pr.body || "";
            const mergerRulePresent = /OpenClaw \/ mini agent actor is not being used as a merger to `main`/i.test(body);

            if (!mergerRulePresent) {
              failGovernance("PR template governance checklist is missing or incomplete.");
            }

            if (!approvalComment) {
              failGovernance(
                "Missing current security-agent approval. Require a `SECURITY_REVIEW: APPROVED` comment from an allowed actor with `PR_HEAD_SHA` matching the current PR head SHA."
              );
            } else {
              summaryLines.push(`Approval actor: ${approvalComment.user?.login || "(unknown)"}`);
              summaryLines.push(`Approval comment id: ${approvalComment.id}`);
            }

            if (allowedMergers.length > 0) {
              summaryLines.push(`Allowed merger actors: ${allowedMergers.join(", ")}`);
            }

            if (conclusion === "success") {
              summaryLines.push("Governance requirements satisfied for the current PR head SHA.");
            }

            await publishCheck(pr.head.sha, {
              title,
              summary: summaryLines.join("\n"),
            });

            core.info(`Governance check published with conclusion '${conclusion}'. Allowed mergers remain: ${allowedMergers.join(",") || "(unset)"}`);
