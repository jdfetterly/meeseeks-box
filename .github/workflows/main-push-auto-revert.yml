name: Main Push Auto Revert

on:
  workflow_run:
    workflows: ["Main Push Policy"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  auto-revert-unauthorized-main-push:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Revert unauthorized commit
        shell: bash
        run: |
          set -euo pipefail
          BAD_SHA="${{ github.event.workflow_run.head_sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git cat-file -e "${BAD_SHA}^{commit}"; then
            git fetch --all --prune
          fi
          git revert --no-edit "${BAD_SHA}"
          git push origin HEAD:main
