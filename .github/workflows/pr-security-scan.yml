name: PR Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-security-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-scan:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run repo security scan
        run: |
          python3 tools/pr_security_scan.py --range "origin/${{ github.base_ref }}...HEAD"
