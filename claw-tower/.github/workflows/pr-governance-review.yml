name: PR Governance Review

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  require-security-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate governance and review signal
        uses: actions/github-script@v7
        env:
          ALLOWED_SECURITY_REVIEW_ACTORS: ${{ vars.ALLOWED_SECURITY_REVIEW_ACTORS }}
          REQUIRED_HUMAN_MERGERS: ${{ vars.ALLOWED_MAIN_PUSH_ACTORS }}
        with:
          script: |
            const reviewActors = (process.env.ALLOWED_SECURITY_REVIEW_ACTORS || "jdfetterly")
              .split(",")
              .map(s => s.trim())
              .filter(Boolean);
            const allowedMergers = (process.env.REQUIRED_HUMAN_MERGERS || "jdfetterly,github-actions[bot]")
              .split(",")
              .map(s => s.trim())
              .filter(Boolean);

            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const approvedReview = reviews.find((review) => {
              const actor = review.user?.login || "";
              return reviewActors.includes(actor) && review.state === "APPROVED";
            });

            const approvalComment = comments.find((comment) => {
              const actor = comment.user?.login || "";
              const body = comment.body || "";
              return reviewActors.includes(actor) && /SECURITY_REVIEW:\s*APPROVED/i.test(body);
            });

            const body = pr.body || "";
            const hasBranchRule = /branch \+ PR/i.test(body);
            const hasMergeRule = /openclaw-mini.+not being used as a merger to `main`/i.test(body);
            const hasTailnetRule = /Tailnet-only \/ loopback-only runtime posture is preserved/i.test(body);

            if (!hasBranchRule || !hasMergeRule || !hasTailnetRule) {
              core.setFailed("PR template governance checklist is missing or incomplete");
              return;
            }

            if (!approvedReview && !approvalComment) {
              core.setFailed(
                "Missing security review. Require APPROVED review or comment `SECURITY_REVIEW: APPROVED` from an allowed actor."
              );
              return;
            }

            core.info(`Governance satisfied. Allowed human mergers remain: ${allowedMergers.join(", ")}`);
